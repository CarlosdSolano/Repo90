name: Build iOS App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS (unsigned simulator app)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install dependencies
        working-directory: Repo90-main
        run: npm install

      - name: Build web app
        working-directory: Repo90-main
        run: npm run build

      - name: Debug Capacitor config
        working-directory: Repo90-main
        run: |
          echo "Directorio actual:"
          pwd
          echo ""
          echo "Archivos de config de Capacitor encontrados:"
          find . -maxdepth 2 -iname "capacitor.config.*"
          echo ""
          echo "Contenido de capacitor.config.json (si existe):"
          cat capacitor.config.json 2>/dev/null || echo "No existe capacitor.config.json en esta carpeta"

      - name: Remove stray Capacitor config (ts/js) if present
        working-directory: Repo90-main
        run: |
          # Capacitor CLI prioriza .ts/.js sobre .json. Si quedó un config
          # .ts/.js vacío o sin appId de un "cap init" anterior, lo elimina
          # para que use el capacitor.config.json correcto del repo.
          if [ -f "capacitor.config.ts" ]; then
            echo "Se encontró capacitor.config.ts, verificando appId..."
            if ! grep -q "appId" capacitor.config.ts; then
              echo "capacitor.config.ts no tiene appId, eliminando para usar el .json"
              rm capacitor.config.ts
            fi
          fi
          if [ -f "capacitor.config.js" ]; then
            echo "Se encontró capacitor.config.js, verificando appId..."
            if ! grep -q "appId" capacitor.config.js; then
              echo "capacitor.config.js no tiene appId, eliminando para usar el .json"
              rm capacitor.config.js
            fi
          fi
- name: Create iOS platform if missing
        working-directory: Repo90-main
        run: |
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "recomposicion-90" "com.recomposicion90.app" --web-dir "dist"
          fi
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor iOS
        working-directory: Repo90-main
        run: npx cap sync ios

      - name: Build iOS Simulator app
        working-directory: Repo90-main/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package simulator app
        working-directory: Repo90-main
        run: |
          mkdir -p artifacts
          APP_PATH=$(find ios/App/build/Build/Products -maxdepth 2 -type d -name 'App.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No se encontró App.app"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/recomposicion-90-ios-simulator.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: recomposicion-90-ios-simulator
          path: Repo90-main/artifacts/recomposicion-90-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14